<!DOCTYPE html>
<html>
<head>
  <title>StreetSignal Admin</title>

  <style>
    body{
      font-family:Arial;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .login-box,
    .dashboard{
      max-width:900px;
      margin:auto;
    }

    .login-box{
      background:white;
      padding:30px;
      border-radius:12px;
      margin-top:100px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      text-align:center;
    }

    input{
      width:100%;
      padding:12px;
      margin-top:10px;
      border-radius:8px;
      border:1px solid #ccc;
    }

    button{
      margin-top:15px;
      padding:12px;
      width:100%;
      border:none;
      background:black;
      color:white;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .card{
      background:white;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
    }

    .resolved{
      opacity:0.6;
      background:#e8ffe8;
    }

    .stats{
      display:flex;
      gap:15px;
      margin-bottom:20px;
    }

    .stat-box{
      flex:1;
      background:white;
      padding:20px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 0 8px rgba(0,0,0,0.1);
    }

    img{
      max-width:200px;
      border-radius:10px;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="login-box" id="loginBox">
  <h2>🔐 StreetSignal Admin</h2>

  <input type="password" id="password" placeholder="Enter admin password">

  <button onclick="login()">Login</button>
</div>

<div class="dashboard" id="dashboard" style="display:none;">

  <div style="
  background:#111;
  color:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
">
  <h1 style="margin:0;">
    🏛️ StreetSignal Municipal Operations Center
  </h1>

  <div style="margin-top:8px; opacity:0.8;">
    Real-time community infrastructure monitoring dashboard
  </div>
</div>
  <!-- STATS -->
  <div class="stats">

  <div class="stat-box">
    <h2 id="pendingCount">0</h2>
    🚨 Pending Issues
  </div>

  <div class="stat-box">
    <h2 id="resolvedCount">0</h2>
    ✅ Resolved Issues
  </div>

  <div class="stat-box">
    <h2 id="totalCount">0</h2>
    📍 Total Reports
  </div>

</div>

<!-- REPORTS CONTAINER -->
<div id="reports"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  update,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const reportsRef = ref(db,"reports");


// ======================
// LOGIN
// ======================

window.login = function () {

  const password = document.getElementById("password").value;

  if (password === "Signal123") {

    // save login session
    localStorage.setItem("streetSignalAuth", "true");

    // refresh counter
    localStorage.setItem("streetSignalRefresh", "0");

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

  } else {
    alert("Wrong password");
  }
};

// ======================
// AUTO LOGIN MEMORY
// ======================

const auth = localStorage.getItem("streetSignalAuth");

if (auth === "true") {

  let refreshes = parseInt(
    localStorage.getItem("streetSignalRefresh") || "0"
  );

  refreshes++;

  localStorage.setItem(
    "streetSignalRefresh",
    refreshes
  );

  // allow 5 refreshes
  if (refreshes <= 5) {

    document.getElementById("loginBox").style.display = "none";
    document.getElementById("dashboard").style.display = "block";

  } else {

    // force logout
    localStorage.removeItem("streetSignalAuth");
    localStorage.removeItem("streetSignalRefresh");

  }
}  

// ======================
// LOAD REPORTS
// ======================

onValue(reportsRef,(snap)=>{

  const reportsDiv=document.getElementById("reports");

  reportsDiv.innerHTML="";

  const data=snap.val();

  if(!data){
    reportsDiv.innerHTML="No reports found.";
    return;
  }

  let pending=0;
let resolved=0;
let total=0;

  Object.entries(data).reverse().forEach(([id,item])=>{

    const status=item.status||"pending";
    total++;
    if(status==="resolved") resolved++;
    else pending++;

    const div=document.createElement("div");

    div.className="card";

div.style.borderLeft =
  status === "resolved"
  ? "6px solid green"
  : "6px solid red";

    if(status==="resolved"){
      div.classList.add("resolved");
    }

    function timeAgo(timestamp){

  const now = Date.now();
  const seconds = Math.floor((now - timestamp) / 1000);

  if(seconds < 60){
    return seconds + " seconds ago";
  }

  const minutes = Math.floor(seconds / 60);

  if(minutes < 60){
    return minutes + " minutes ago";
  }

  const hours = Math.floor(minutes / 60);

  if(hours < 24){
    return hours + " hours ago";
  }

  const days = Math.floor(hours / 24);

  if(days === 1){
    return "Yesterday";
  }

  if(days < 7){
    return days + " days ago";
  }

  return new Date(timestamp).toLocaleString();
}

const date = item.createdAt
  ? timeAgo(item.createdAt)
  : "Unknown";

    div.innerHTML=`

      <h3>${item.issueType}</h3>

      <b>Description:</b><br>
      ${item.description||"No description"}<br><br>

      <b>Location:</b><br>
      ${item.location}<br><br>

      <b>GPS:</b><br>
      ${item.lat}, ${item.lng}<br><br>

      <b>Status:</b>
      ${status}<br><br>

      <b>Submitted:</b><br>
      ${date}<br><br>

      ${item.photo
        ? `<img src="${item.photo}">`
        : ""
      }

      <br><br>

<button onclick="markResolved('${id}')">
  ✅ Mark Resolved
</button>

<button onclick="deleteReport('${id}')">
  ❌ Delete
</button>

    `;

    reportsDiv.appendChild(div);

  });

  document.getElementById("pendingCount").innerText=pending;
  document.getElementById("resolvedCount").innerText=resolved;
  document.getElementById("totalCount").innerText=total;
  
});


// ======================
// RESOLVE
// ======================

window.markResolved=function(id){

  update(ref(db,"reports/"+id),{
    status:"resolved"
  });

};


// ======================
// DELETE
// ======================

window.deleteReport=function(id){

  if(confirm("Delete this report?")){

    remove(ref(db,"reports/"+id));

  }

};

</script>

</body>
</html>
