<!DOCTYPE html>
<html>
<head>
  <title>City Issues Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .filter-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      line-height: 1.8;
    }

    .filter-box button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .title-box {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-size: 18px;
      font-weight: bold;
    }

    .gps-btn {
      position: absolute;
      top: 70px;
      left: 60px;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }

    .admin-btn {
      position: absolute;
      top: 120px;
      left: 60px;
      z-index: 1000;
      background: darkred;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }

  </style>
</head>

<body>

<div class="title-box">📍 City Issues Live Map</div>

<button class="gps-btn" onclick="useMyLocation()">📡 Use My Location</button>
<button class="admin-btn" onclick="adminLogin()">🔐 Admin Login</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// ================= MAP =================
const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ================= DATA =================
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9XfC_CAGjV2JUkf9oM8FuvvKWZyljXpnfXSIeRyJjffdqGyJgVxE1-4fvOjsuHpOJ4QVgZzTIj4GH/pub?output=csv";

let allMarkers = [];
let isAdmin = false;

// ================= COLORS =================
function getColor(type) {

  type = (type || "").toLowerCase();

  if (type.includes("road")) return "red";

  if (
    type.includes("water") ||
    type.includes("pipe") ||
    type.includes("leak")
  ) return "blue";

  if (
    type.includes("electric") ||
    type.includes("power")
  ) return "yellow";

  return "green";
}

// ================= ADMIN =================
function adminLogin() {

  const pass = prompt("Enter admin password:");

  if (pass === "admin123") {
    isAdmin = true;
    alert("Admin mode ON");
    loadData();
  } else {
    alert("Wrong password");
  }
}

// ================= GEO =================
function geocode(loc, cb) {

  fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(loc))
    .then(r => r.json())
    .then(d => {
      if (d && d.length > 0) cb(d[0].lat, d[0].lon);
    });

}

// ================= CLEAR =================
function clearMarkers() {
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];
}

// ================= LOAD DATA =================
function loadData() {

  clearMarkers();

  fetch(sheetURL)
    .then(r => r.text())
    .then(text => {

      const rows = text.trim().split("\n");

      for (let i = 1; i < rows.length; i++) {

        const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

        const type = cols[2];
        const desc = cols[3];
        const loc = cols[4];
        const duration = cols[5];
        const status = cols[6] || "Pending";

        if (!type || !loc) continue;

        geocode(loc, (lat, lng) => {

          const color = getColor(type);

          const icon = L.icon({
            iconUrl:
              color === "red"
                ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
                : color === "blue"
                ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
                : color === "yellow"
                ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
                : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
            iconSize: [32, 32],
            iconAnchor: [16, 32]
          });

          const marker = L.marker([lat, lng], { icon }).addTo(map);

          marker.issueType = type.toLowerCase();

          marker.bindPopup(`

            <b>${type}</b><br><br>
            ${desc || ""}<br><br>
            <b>Location:</b> ${loc}<br>
            <b>Status:</b> ${status}<br><br>

            ${isAdmin ? `
              <button onclick="alert('Verify logic placeholder')">✔ Verify</button>
              <button onclick="alert('Resolve logic placeholder')">✅ Resolve</button>
            ` : ""}

          `);

          allMarkers.push(marker);

        });

      }

    });

}

// ================= FILTER =================
function filter(type) {

  allMarkers.forEach(m => {

    if (type === "all") map.addLayer(m);
    else if (m.issueType.includes(type)) map.addLayer(m);
    else map.removeLayer(m);

  });

}

// ================= UI =================
const control = L.control({ position: 'topright' });

control.onAdd = function () {

  const div = L.DomUtil.create('div', 'filter-box');

  div.innerHTML = `
    <b>Filters</b><br>
    <button onclick="filter('all')">All</button>
    <button onclick="filter('road')">Road</button>
    <button onclick="filter('water')">Water</button>
    <button onclick="filter('electric')">Electric</button>
  `;

  return div;

};

control.addTo(map);

// ================= GPS =================
function useMyLocation() {

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat, lng], 15);

    L.marker([lat, lng])
      .addTo(map)
      .bindPopup("📡 You are here")
      .openPopup();

  });

}

// ================= START =================
loadData();
setInterval(loadData, 30000);

</script>

</body>
</html>
