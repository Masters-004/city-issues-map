<!DOCTYPE html>
<html>
<head>
  <title>StreetSignal Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .title-box {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-size: 18px;
      font-weight: bold;
    }

    .gps-btn {
      position: absolute;
      top: 70px;
      left: 60px;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      border: none;
    }

    .report-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 10px;
      width: 260px;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
    }

    .report-box input {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px;
    }

    .report-box button {
      width: 100%;
      padding: 8px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    .filter-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      line-height: 1.6;
      font-size: 14px;
      min-width: 180px;
    }

    .filter-box button {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #f2f2f2;
    }

    .filter-box button:hover {
      background: #ddd;
    }

    hr {
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="title-box">📍 StreetSignal Live Map</div>

<button class="gps-btn" onclick="useMyLocation()">📡 Use My Location</button>

<div class="report-box">
  <b>Report Issue</b><br><br>

  <input id="issueType" placeholder="Issue type (road, water, electric)">
  <input id="description" placeholder="Description">
  <input id="location" placeholder="Location (optional)">
  <input id="photo" type="file" accept="image/*">

  <button onclick="submitReport()">Submit</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const reportsRef = ref(db, "reports");

const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let markers = [];
let myLocationMarker = null;

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

function getColor(type = "") {
  type = type.toLowerCase();
  if (type.includes("road")) return "red";
  if (type.includes("water")) return "blue";
  if (type.includes("electric")) return "yellow";
  return "green";
}

onValue(reportsRef, (snapshot) => {

  clearMarkers();

  const data = snapshot.val();
  if (!data) return;

  Object.values(data).forEach(item => {

    if (!item.lat || !item.lng) return;

    const status = item.status || "pending";
    const color = status === "resolved" ? "green" : getColor(item.issueType);

    const icon = L.icon({
      iconUrl:
        color === "red"
          ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
          : color === "blue"
          ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
          : color === "yellow"
          ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
          : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    const marker = L.marker([item.lat, item.lng], { icon }).addTo(map);

    marker.issueType = (item.issueType || "").toLowerCase();

    marker.bindPopup(`
      <b>${item.issueType}</b><br><br>

      ${item.photo ? `<img src="${item.photo}" width="200"><br><br>` : ""}

      ${item.description || ""}<br><br>

      <b>Location:</b> ${item.location}<br>
      <b>Status:</b> ${status.toUpperCase()}<br>
      <b>GPS:</b> ${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}
    `);

    markers.push(marker);
  });

});

// FIXED SAVE SYSTEM (GPS + typed location)
window.submitReport = function () {

  const issueType = document.getElementById("issueType").value;
  const description = document.getElementById("description").value;
  const locationText = document.getElementById("location").value;
  const photoFile = document.getElementById("photo").files[0];

  if (!issueType) return alert("Enter issue type");

  function save(lat, lng) {

    const reader = new FileReader();

    reader.onload = function () {

      push(reportsRef, {
        issueType: issueType.toLowerCase(),
        description: description || "",
        location: locationText || "GPS Location",
        lat,
        lng,
        photo: photoFile ? reader.result : "",
        status: "pending",
        createdAt: Date.now()
      });

      alert("Report submitted ✅");

    };

    if (photoFile) reader.readAsDataURL(photoFile);
    else reader.onload();

  }

  if (locationText.trim()) {

    fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(locationText))
      .then(r => r.json())
      .then(data => {

        if (!data.length) return alert("Location not found");

        save(parseFloat(data[0].lat), parseFloat(data[0].lon));

      });

  } else {

    navigator.geolocation.getCurrentPosition(pos => {
      save(pos.coords.latitude, pos.coords.longitude);
    });

  }

};

window.useMyLocation = function () {

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat, lng], 15);

    if (myLocationMarker) map.removeLayer(myLocationMarker);

    myLocationMarker = L.marker([lat, lng])
      .addTo(map)
      .bindPopup("📡 You are here")
      .openPopup();

  });

};

window.filterMarkers = function(type) {

  type = type.toLowerCase();

  markers.forEach(m => {

    if (type === "all") map.addLayer(m);
    else if ((m.issueType || "").includes(type)) map.addLayer(m);
    else map.removeLayer(m);

  });

};

const control = L.control({ position: 'topright' });

control.onAdd = function () {

  const div = L.DomUtil.create('div', 'filter-box');

  div.innerHTML = `
    <b>Filters</b><br>
    <button onclick="filterMarkers('all')">All</button>
    <button onclick="filterMarkers('road')">Road</button>
    <button onclick="filterMarkers('water')">Water</button>
    <button onclick="filterMarkers('electric')">Electric</button>
  `;

  return div;
};

control.addTo(map);

</script>

</body>
</html>
