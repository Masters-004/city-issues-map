<!DOCTYPE html>
<html>
<head>
  <title>City Issues Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .filter-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      line-height: 1.8;
    }

    .filter-box button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .title-box {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-size: 18px;
      font-weight: bold;
    }

    .gps-btn {
      position: absolute;
      top: 70px;
      left: 60px;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      border: none;
    }
  </style>
</head>

<body>

<div class="title-box">
  📍 City Issues Live Map
</div>

<button class="gps-btn" onclick="useMyLocation()">
  📡 Use My Location
</button>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

// ==========================
// 🔥 FIREBASE IMPORTS
// ==========================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


// ==========================
// 🔥 FIREBASE CONFIG
// ==========================
const firebaseConfig = {
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
};


// ==========================
// 🔥 INIT FIREBASE
// ==========================
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

console.log("🔥 Firebase connected");

const reportsRef = ref(database, "reports");


// ==========================
// 🗺️ MAP
// ==========================
const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);


// ==========================
// 📍 STORAGE
// ==========================
let allMarkers = [];
let myLocationMarker = null;


// ==========================
// 🧹 CLEAR MARKERS
// ==========================
function clearMarkers() {
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];
}


// ==========================
// 🎨 COLOR RULES
// ==========================
function getMarkerColor(type = "") {
  type = type.toLowerCase();

  if (type.includes("road")) return "red";
  if (type.includes("water") || type.includes("pipe") || type.includes("leak")) return "blue";
  if (type.includes("electric") || type.includes("power")) return "yellow";
  return "green";
}


// ==========================
// 🔴 LIVE FIREBASE LISTENER
// ==========================
onValue(reportsRef, (snapshot) => {

  clearMarkers();

  const data = snapshot.val();
  if (!data) return;

  Object.values(data).forEach((item) => {

    if (!item.lat || !item.lng) return;

    const color = getMarkerColor(item.issueType);

    const icon = L.icon({
      iconUrl:
        color === "red"
          ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
          : color === "blue"
          ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
          : color === "yellow"
          ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
          : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",

      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    const marker = L.marker([item.lat, item.lng], { icon }).addTo(map);

    marker.issueType = (item.issueType || "").toLowerCase();

    marker.bindPopup(`
      <b>${item.issueType || "Issue"}</b><br><br>
      ${item.description || "No description"}<br><br>
      <b>Location:</b> ${item.location || "Unknown"}
    `);

    allMarkers.push(marker);
  });

});


// ==========================
// 📡 GPS
// ==========================
window.useMyLocation = function () {

  if (!navigator.geolocation) {
    alert("Geolocation not supported.");
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat, lng], 15);

    if (myLocationMarker) map.removeLayer(myLocationMarker);

    myLocationMarker = L.marker([lat, lng])
      .addTo(map)
      .bindPopup("📡 Your Current Location")
      .openPopup();

  }, () => {
    alert("Location access denied.");
  });

};


// ==========================
// 🔘 FILTERS
// ==========================
window.filterMarkers = function(type) {

  allMarkers.forEach(marker => {

    if (type === "all") {
      map.addLayer(marker);
    } else if (marker.issueType.includes(type)) {
      map.addLayer(marker);
    } else {
      map.removeLayer(marker);
    }

  });

};


// ==========================
// 🎛️ UI CONTROLS
// ==========================
const control = L.control({ position: 'topright' });

control.onAdd = function () {

  const div = L.DomUtil.create('div', 'filter-box');

  div.innerHTML = `
    <b>Issue Filters</b><br>

    <button onclick="filterMarkers('all')">🌍 All Issues</button>
    <button onclick="filterMarkers('road')">🛣️ Road Issues</button>
    <button onclick="filterMarkers('water')">💧 Water Issues</button>
    <button onclick="filterMarkers('electric')">⚡ Electricity</button>
  `;

  return div;
};

control.addTo(map);

</script>

</body>
</html>
