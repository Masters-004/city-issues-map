<!DOCTYPE html>
<html>
<head>
  <title>StreetSignal Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin:0; font-family: Arial; }

    #map { height:100vh; width:100%; }

    .title-box{
      position:absolute; top:10px; left:60px;
      z-index:1000; background:white;
      padding:10px 15px;
      border-radius:10px;
      font-weight:bold;
    }

    .gps-btn{
      position:absolute; top:70px; left:60px;
      z-index:1000; background:#111;
      color:#fff; border:none;
      padding:10px 15px;
      border-radius:8px;
      cursor:pointer;
    }

    .report-box{
      position:absolute; bottom:20px; right:20px;
      z-index:1000; background:white;
      padding:15px;
      width:260px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    .report-box input{
      width:100%; padding:6px; margin-bottom:6px;
    }

    .report-box button{
      width:100%; padding:8px;
      background:black; color:white;
      border:none; cursor:pointer;
    }

    /* FILTER BOX (FIXED STABLE STYLE) */
    .filter-box{
      background:white;
      padding:12px;
      border-radius:10px;
      font-size:14px;
      line-height:1.4;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      min-width:180px;
    }

    .filter-box button{
      width:100%;
      margin-top:5px;
      padding:6px;
      border:none;
      border-radius:6px;
      cursor:pointer;
      background:#f2f2f2;
      font-weight:bold;
    }

    .filter-box button:hover{
      background:#ddd;
    }

    .resolved{
      opacity:0.4;
      filter:grayscale(80%);
    }
  </style>
</head>

<body>

<div class="title-box">📍 StreetSignal Live Map</div>
<button class="gps-btn" onclick="useMyLocation()">📡 Use My Location</button>

<div class="report-box">
  <b>Report Issue</b><br><br>

  <input id="issueType" placeholder="Issue type">
  <input id="description" placeholder="Description">
  <input id="location" placeholder="Location">
  <input id="photo" type="file">

  <button onclick="submitReport()">Submit</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* FIREBASE */
const app = initializeApp({
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
});

const db = getDatabase(app);
const reportsRef = ref(db,"reports");

/* MAP */
const map = L.map("map").setView([-26.2041,28.0473],11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
  attribution:"&copy; OpenStreetMap"
}).addTo(map);

let markers=[];
let gpsMarker=null;

/* CLEAR */
function clearMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
}

/* COLOR */
function getColor(t){
  t=(t||"").toLowerCase();
  if(t.includes("road")) return "red";
  if(t.includes("water")) return "blue";
  if(t.includes("electric")) return "yellow";
  return "green";
}

/* LOAD DATA */
onValue(reportsRef,snap=>{

  clearMarkers();

  const data=snap.val();
  if(!data) return;

  Object.entries(data).forEach(([id,item])=>{

    if(!item.lat||!item.lng) return;

    const c=getColor(item.issueType);
    const resolved=item.status==="resolved";

    const icon=L.icon({
      iconUrl:
        c==="red"
        ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
        : c==="blue"
        ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        : c==="yellow"
        ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
        : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
      iconSize:[32,32],
      iconAnchor:[16,32]
    });

    const m=L.marker([item.lat,item.lng],{icon}).addTo(map);

    if(resolved){
      m._icon?.classList.add("resolved");
    }

    m.issueType=item.issueType;

    m.bindPopup(`
      <b>${item.issueType}</b><br><br>

      ${item.description||""}<br><br>

      ${item.photo?`<img src="${item.photo}" width="180"><br><br>`:""}

      <b>Location:</b> ${item.location}<br>
      <b>GPS:</b> ${item.lat.toFixed(5)}, ${item.lng.toFixed(5)}<br>
      <b>Status:</b> ${item.status||"pending"}<br><br>

      <button onclick="markResolved('${id}')">Mark Resolved</button>
    `);

    markers.push(m);
  });

});

/* SUBMIT FIXED */
window.submitReport=function(){

  const type=issueType.value.trim();
  const desc=description.value.trim();
  const loc=location.value.trim();
  const file=photo.files[0];

  if(!type || !loc){
    alert("Fill issue type + location");
    return;
  }

  fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(loc))
  .then(r=>r.json())
  .then(d=>{

    if(!d.length){
      alert("Location not found");
      return;
    }

    const lat=parseFloat(d[0].lat);
    const lng=parseFloat(d[0].lon);

    const save=(img="")=>{
      push(reportsRef,{
        issueType:type,
        description:desc,
        location:loc,
        lat,lng,
        photo:img,
        status:"pending",
        createdAt:Date.now()
      });

      alert("Submitted ✅");

      issueType.value="";
      description.value="";
      location.value="";
      photo.value="";
    };

    if(!file){
      save("");
      return;
    }

    const reader=new FileReader();
    reader.onload=()=>save(reader.result);
    reader.readAsDataURL(file);

  });

};

/* RESOLVE */
window.markResolved=function(id){
  update(ref(db,"reports/"+id),{status:"resolved"});
};

/* GPS FIXED */
window.useMyLocation=function(){

  navigator.geolocation.getCurrentPosition(pos=>{

    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    map.setView([lat,lng],15);

    if(gpsMarker) map.removeLayer(gpsMarker);

    gpsMarker=L.marker([lat,lng])
      .addTo(map)
      .bindPopup("📡 You are here")
      .openPopup();

  },()=>alert("Enable location permissions"));

};

/* FILTER FIXED */
window.filterMarkers=function(type){

  type=(type||"all").toLowerCase();

  markers.forEach(m=>{

    const match=(m.issueType||"").toLowerCase();

    const show=type==="all"||match.includes(type);

    if(show) map.addLayer(m);
    else map.removeLayer(m);

  });

};

/* 🔥 FIXED CONTROL (THIS WAS THE BUG BEFORE) */
const control=L.control({position:"topright"});

control.onAdd=function(){

  const div=L.DomUtil.create("div","filter-box");

  div.innerHTML=`
    <b>Filters</b><br>

    <button onclick="filterMarkers('all')">All</button>
    <button onclick="filterMarkers('road')">Road</button>
    <button onclick="filterMarkers('water')">Water</button>
    <button onclick="filterMarkers('electric')">Electric</button>

    <hr>

    <b>Legend</b><br>
    🔴 Road<br>
    🔵 Water<br>
    🟡 Electricity<br>
    🟢 Other
  `;

  return div;
};

control.addTo(map);

</script>

</body>
</html>
