<!DOCTYPE html>
<html>
<head>
  <title>StreetSignal Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* =========================
       LEFT CONTROL PANEL (NEW)
    ========================== */
    .ui-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 2000;
      width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .gps-btn {
      background: #111;
      color: white;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      border: none;
    }

    .report-box input {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px;
    }

    .report-box button {
      width: 100%;
      padding: 8px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
    }

    .filter-box button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>

<body>

<!-- =========================
     UI PANEL (FIXED LAYOUT)
========================== -->
<div class="ui-panel">

  <div class="box title">
    📍 StreetSignal Live Map
  </div>

  <button class="gps-btn" onclick="useMyLocation()">
    📡 Use My Location
  </button>

  <div class="box report-box">
    <b>Report Issue</b><br><br>

    <input id="issueType" placeholder="Issue type (road, water, electric)">
    <input id="description" placeholder="Description">
    <input id="location" placeholder="Location (e.g Soweto)">

    <button onclick="submitReport()">Submit</button>
  </div>

  <div class="box filter-box">
    <b>Filters</b><br>

    <button onclick="filterMarkers('all')">All</button>
    <button onclick="filterMarkers('road')">Road</button>
    <button onclick="filterMarkers('water')">Water</button>
    <button onclick="filterMarkers('electric')">Electric</button>
  </div>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

// ==========================
// FIREBASE IMPORTS
// ==========================
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


// ==========================
// FIREBASE CONFIG
// ==========================
const firebaseConfig = {
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
};


// ==========================
// INIT FIREBASE
// ==========================
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);
const reportsRef = ref(database, "reports");

console.log("🔥 Firebase connected");


// ==========================
// MAP
// ==========================
const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);


// ==========================
// STORAGE
// ==========================
let allMarkers = [];
let myLocationMarker = null;


// ==========================
// CLEAR MARKERS
// ==========================
function clearMarkers() {
  allMarkers.forEach(m => map.removeLayer(m));
  allMarkers = [];
}


// ==========================
// COLOR SYSTEM
// ==========================
function getMarkerColor(type = "") {

  type = type.toLowerCase();

  if (type.includes("road")) return "red";
  if (type.includes("water") || type.includes("pipe") || type.includes("leak")) return "blue";
  if (type.includes("electric") || type.includes("power")) return "yellow";

  return "green";
}


// ==========================
// LIVE FIREBASE MAP
// ==========================
onValue(reportsRef, (snapshot) => {

  clearMarkers();

  const data = snapshot.val();
  if (!data) return;

  Object.values(data).forEach(item => {

    if (!item.lat || !item.lng) return;

    const color = getMarkerColor(item.issueType);

    const icon = L.icon({
      iconUrl:
        color === "red"
          ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
          : color === "blue"
          ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
          : color === "yellow"
          ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
          : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -30]
    });

    const marker = L.marker([item.lat, item.lng], { icon }).addTo(map);

    marker.issueType = (item.issueType || "").toLowerCase();

    marker.bindPopup(`
      <b>${item.issueType}</b><br><br>
      ${item.description || ""}<br><br>
      <b>Location:</b> ${item.location}
    `);

    allMarkers.push(marker);
  });

});


// ==========================
// SUBMIT REPORT
// ==========================
window.submitReport = function () {

  const issueType = document.getElementById("issueType").value;
  const description = document.getElementById("description").value;
  const location = document.getElementById("location").value;

  if (!issueType || !location) {
    alert("Fill issue type + location");
    return;
  }

  fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(location))
    .then(res => res.json())
    .then(data => {

      if (!data.length) {
        alert("Location not found");
        return;
      }

      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);

      push(reportsRef, {
        issueType: issueType.toLowerCase(),
        description: description || "",
        location,
        lat,
        lng,
        status: "pending",
        createdAt: Date.now()
      });

      alert("Report submitted ✅");

      document.getElementById("issueType").value = "";
      document.getElementById("description").value = "";
      document.getElementById("location").value = "";

    });

};


// ==========================
// GPS
// ==========================
window.useMyLocation = function () {

  navigator.geolocation.getCurrentPosition(pos => {

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat, lng], 15);

    if (myLocationMarker) map.removeLayer(myLocationMarker);

    myLocationMarker = L.marker([lat, lng])
      .addTo(map)
      .bindPopup("📡 You are here")
      .openPopup();

  });

};


// ==========================
// FILTERS
// ==========================
window.filterMarkers = function(type) {

  type = (type || "").toLowerCase();

  allMarkers.forEach(marker => {

    const match = marker.issueType || "";

    if (type === "all") {
      map.addLayer(marker);
    } else if (match.includes(type)) {
      map.addLayer(marker);
    } else {
      map.removeLayer(marker);
    }

  });

};

</script>

</body>
</html>
