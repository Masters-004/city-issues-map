<!DOCTYPE html>
<html>
<head>
  <title>City Issues Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body { margin: 0; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

// 🗺️ MAP INIT
const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// 📊 YOUR GOOGLE SHEET CSV
const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS9XfC_CAGjV2JUkf9oM8FuvvKWZyljXpnfXSIeRyJjffdqGyJgVxE1-4fvOjsuHpOJ4QVgZzTIj4GH/pub?output=csv";

// 🎨 ICONS
function getIcon(type) {
  type = (type || "").toLowerCase();

  if (type.includes("road")) {
    return L.icon({ iconUrl: "https://maps.google.com/mapfiles/ms/icons/red-dot.png" });
  }

  if (type.includes("water")) {
    return L.icon({ iconUrl: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png" });
  }

  return L.icon({ iconUrl: "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png" });
}

// 🌍 GEOCODING
function geocode(location, cb) {

  fetch("https://nominatim.openstreetmap.org/search?format=json&q=" + encodeURIComponent(location))
    .then(r => r.json())
    .then(data => {

      if (data && data.length > 0) {
        cb(data[0].lat, data[0].lon);
      } else {
        console.log("❌ No location match:", location);
      }

    })
    .catch(err => console.log("GEOCODE ERROR:", err));

}

// 📡 LOAD SHEET DATA (FIXED)
fetch(sheetURL)
  .then(res => res.text())
  .then(text => {

    const rows = text.trim().split("\n");

    console.log("TOTAL ROWS:", rows.length);

    for (let i = 1; i < rows.length; i++) {

      // SAFE CSV PARSING (handles commas properly)
      const cols = rows[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);

      const type = cols[2];
      const desc = cols[3];
      const loc = cols[4];
      const duration = cols[5];

      if (!type || !loc) {
        console.log("SKIPPED:", rows[i]);
        continue;
      }

      console.log("PROCESSING:", type, loc);

      geocode(loc, (lat, lng) => {

        if (!lat || !lng) {
          console.log("❌ Geocode failed:", loc);
          return;
        }

        const marker = L.marker([lat, lng], {
          icon: getIcon(type)
        }).addTo(map);

        marker.bindPopup(
          "<b>" + type + "</b><br>" +
          (desc || "") + "<br>" +
          "<i>" + loc + "</i><br>" +
          (duration || "")
        );

      });

    }

  });

</script>

</body>
</html>
