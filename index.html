<!DOCTYPE html>
<html>
<head>
  <title>StreetSignal Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    /* TITLE */
    .title-box {
      position: absolute;
      top: 10px;
      left: 60px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      font-size: 18px;
      font-weight: bold;
    }

    /* GPS */
    .gps-btn {
      position: absolute;
      top: 70px;
      left: 60px;
      z-index: 1000;
      background: #111;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      border: none;
    }

    /* REPORT BOX */
    .report-box {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
      background: white;
      padding: 15px;
      border-radius: 10px;
      width: 260px;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
    }

    .report-box input {
      width: 100%;
      margin-bottom: 6px;
      padding: 6px;
    }

    .report-box button {
      width: 100%;
      padding: 8px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
    }

    /* FILTERS */
    .filter-box {
      background: white;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      line-height: 1.6;
      font-size: 14px;
      min-width: 180px;
    }

    .filter-box button {
      width: 100%;
      padding: 6px;
      margin-top: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      background: #f2f2f2;
    }

    .filter-box button:hover {
      background: #ddd;
    }

    hr {
      margin: 10px 0;
    }

    .resolved {
      opacity: 0.5;
      filter: grayscale(70%);
    }

  </style>
</head>

<body>

<div class="title-box">📍 StreetSignal Live Map</div>

<button class="gps-btn" onclick="useMyLocation()">📡 Use My Location</button>

<div class="report-box">
  <b>Report Issue</b><br><br>

  <input id="issueType" placeholder="Issue type">
  <input id="description" placeholder="Description">
  <input id="location" placeholder="Location">
  <input id="photo" type="file" accept="image/*">

  <button onclick="submitReport()">Submit</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  update
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKpUKGcRpGCw9z03tVKbuWJiqSEk8p8hM",
  authDomain: "streetsignal-0409.firebaseapp.com",
  databaseURL: "https://streetsignal-0409-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "streetsignal-0409",
  storageBucket: "streetsignal-0409.firebasestorage.app",
  messagingSenderId: "839732414610",
  appId: "1:839732414610:web:77851feed591796028be4b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const reportsRef = ref(db, "reports");

const map = L.map('map').setView([-26.2041, 28.0473], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

let markers = [];
let gpsMarker = null;

/* CLEAR */
function clearMarkers(){
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

/* COLORS */
function getColor(type){
  type = (type || "").toLowerCase();

  if(type.includes("road")) return "red";
  if(type.includes("water")) return "blue";
  if(type.includes("electric")) return "yellow";
  return "green";
}

/* LOAD DATA */
onValue(reportsRef, (snap)=>{

  clearMarkers();

  const data = snap.val();
  if(!data) return;

  Object.entries(data).forEach(([id,item])=>{

    if(!item.lat || !item.lng) return;

    const color = getColor(item.issueType);
    const resolved = item.status === "resolved";

    const icon = L.icon({
      iconUrl:
        color === "red"
        ? "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
        : color === "blue"
        ? "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        : color === "yellow"
        ? "https://maps.google.com/mapfiles/ms/icons/yellow-dot.png"
        : "https://maps.google.com/mapfiles/ms/icons/green-dot.png",
      iconSize:[32,32],
      iconAnchor:[16,32]
    });

    const marker = L.marker([item.lat,item.lng],{icon}).addTo(map);

    if(resolved){
      marker._icon?.classList.add("resolved");
    }

    marker.bindPopup(`
      <b>${item.issueType}</b><br>
      <b>Status:</b> ${item.status || "pending"}<br><br>
      ${item.description || ""}<br><br>
      ${item.photo ? `<img src="${item.photo}" width="180"><br>` : ""}
      ${item.location}
      <br><br>
      <button onclick="markResolved('${id}')">Mark Resolved</button>
    `);

    marker.issueType = item.issueType || "";
    marker.status = item.status || "pending";

    markers.push(marker);
  });

});

/* SUBMIT */
window.submitReport = function(){

  const type = issueType.value;
  const desc = description.value;
  const loc = location.value;
  const file = photo.files[0];

  if(!type || !loc){
    alert("Fill required fields");
    return;
  }

  fetch("https://nominatim.openstreetmap.org/search?format=json&q="+encodeURIComponent(loc))
  .then(r=>r.json())
  .then(d=>{

    if(!d.length){
      alert("Location not found");
      return;
    }

    const lat = parseFloat(d[0].lat);
    const lng = parseFloat(d[0].lon);

    const reader = new FileReader();

    reader.onload = function(){

      push(reportsRef,{
        issueType:type,
        description:desc,
        location:loc,
        lat,
        lng,
        photo: file ? reader.result : "",
        status:"pending",
        createdAt:Date.now()
      });

      alert("Submitted ✅");

    };

    if(file) reader.readAsDataURL(file);
    else reader.onload();

  });

};

/* RESOLVE */
window.markResolved = function(id){
  update(ref(db,"reports/"+id),{
    status:"resolved"
  });
};

/* GPS */
window.useMyLocation = function(){

  navigator.geolocation.getCurrentPosition(pos=>{

    const lat = pos.coords.latitude;
    const lng = pos.coords.longitude;

    map.setView([lat,lng],15);

    if(gpsMarker) map.removeLayer(gpsMarker);

    gpsMarker = L.marker([lat,lng])
    .addTo(map)
    .bindPopup("You are here");

  });

};

// ==========================
// FILTER SYSTEM (FIXED)
// ==========================
let activeFilter = "all";

window.filterMarkers = function(type) {
  activeFilter = (type || "all").toLowerCase();

  markers.forEach(marker => {
    const match = (marker.issueType || "").toLowerCase();

    const shouldShow =
      activeFilter === "all" ||
      match.includes(activeFilter);

    if (shouldShow) {
      if (!map.hasLayer(marker)) map.addLayer(marker);
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
};


// ==========================
// CONTROL UI (FIXED + LEGEND GUARANTEED)
// ==========================
const control = L.control({ position: "topright" });

control.onAdd = function () {
  const div = L.DomUtil.create("div", "filter-box");

  div.innerHTML = `
    <div style="font-weight:bold; margin-bottom:6px;">Filters</div>

    <button onclick="filterMarkers('all')">🌍 All Issues</button>
    <button onclick="filterMarkers('road')">🛣️ Road</button>
    <button onclick="filterMarkers('water')">💧 Water</button>
    <button onclick="filterMarkers('electric')">⚡ Electricity</button>

    <hr>

    <div style="font-weight:bold;">Legend</div>
    <div>🔴 Road Issue</div>
    <div>🔵 Water Issue</div>
    <div>🟡 Electricity Issue</div>
    <div>🟢 Other Issue</div>
  `;

  return div;
};

control.addTo(map);

</script>

</body>
</html>
